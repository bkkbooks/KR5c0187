body:
  text: 女青鬼律卷之五六同卷力九道曰天下憒憒常如浮雲君圖其臣婦謀其夫熒惑太白變作人專作苟語小兒邊走作邪僞相交連撲子喉咽不得吞治進道路更相傳念子死亡不出年一則大樂後相恐天地運㑹故令然受任主者當令勤盡當守一修長存勿得任意唯捉心不行三五唯邪滛言天大道而不禁三官主者擇種民取合炁者萬八千從來至今有幾人大限未足子勤身改心易腸道真人師受口訣以見賢佩吾劵契一爲先得見太平神仙君五帝主者傳祕言三五七九道炁尊治在清微崑崙山近見三天入人身解脫網羅拜老君安心定意行至仙長短須已勿半身可至契令思元辰七九之運别真人天下人民各頑愚見世憒憒不知憂寒鬼入來與子遊太白流横長六朱老公道上更相扶饑餓摶頰輙叩頭米榖金貴不可求災兵大厄庚子年念子命運與此堅方外故州胡夷人交頸腫領惡逆民化生風毒身奉天大小皆來至此間餘有胡鬼億萬千食人血性逆毛遷今來入國汝何縁兵馬浩亂不可言念子一旦與相連入歩不進屈輙申子若不信庚子年自當思吾今日言日月冥冥恐无光五榖不生逆鬼行是庚子歳約不亡若有餘人如飛蜂大小更互道相從三五相逐一合雙念子一旦不值逢未至此年當死亡百不遺一柰何從天日與月當更生唯留下地太平中種民在天見母親不信大道念可言非不慈孝道不存一旦如此豈可言何不少學得神仙太平過度爲真人日月列布如流星三五七九道炁明分布九州若父兄皆同一契心合并義各如一道引經黄赤大要守長生上部太紫人數并萬萬之紀合神靈託愚作癡不言聲以守三一從道經千炁不失事見明天道蕩蕩信自有旦來暮去天地久以日爲夫月爲妻天氣交接等何如神壟大山依神居自見元化不安廬束手真實不發舒超王之教故可胥北斗中有太白星三角浩浩象人形遊走天下化不平有知者悟愚者驚誰正此道有姓名木子三台常與并約在大㑹天下平五行列布金木生火水父母土爲營道出元炁從老經合景内外神真形羅縷紫機上天庭逺望八極登太清八八之數從一生子心不解口語名天地隂陽人爲先五體骨節皆有神樂人長生俱飛仙除辟大厄却災患少知三五以治身長行七九真炁分太平度世爲種民天下男女合如雲㑹於太一仙道人三日不摩徊復還一心兩口上應天子之長生出子心三五七九一爲親唯炁大正爲種民解脫羅網具身神白日髙飛入天堂千年出一丈六軀五嶽四瀆出九州合成海水不復流故出女青鬼律書傳行天下樂何如有智自來謁真儔元者自去太山居白骨縱横鬼喑噁喻哬不止奈何餘仙童玉女依神居望見斯軰當何如切切天下真欲弊庚子之年其運至千无一人可得脫有心相遇世道清逺惡從善不求榮塵垢之衣以蔽形心在太一詠誦經白日修善暮守生被髪而行在黄庭上啓太上道姓名一出玄都入太清口授異訣過災殃念世愚子不知生何當合㑹隨邪靈太一來下條姓名恐子一身不久停發願不死從吾經天師曰大道垂律女青所傳三五七九長生之本以奉行世世相傳子有心分來入吾炁自當思行仁義六合守忠專一養性以道爲家不得負違太上真言師老太一今故以元年正月七日奉行從者千人之中有王長趙昇二人可以道炁化度令畢得長生大義不得犯男女神靈不得呼天引地不得祠祭故炁不得指鬼呼神不得滛色違慢不得言炁不明不得兩心不正不得妄傳鬼教不得露行三光不得犯五靈七政不得與鬼通同不得干亂神祇不得入俗勝真不得行來出入以急有厄呼嗟鬼神女青鬼律卷之五
