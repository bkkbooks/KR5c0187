body:
  text: 右五斗煞鬼名姓主煞人東方凶神鬼姓堅名角子南方凶神鬼姓精名玉又名後竹西方凶神鬼姓天邪名古子抑救切北方凶神鬼姓王名精中央凶神鬼姓戴名應子右五方凶神鬼姓名主煞人五方逆煞注鬼名朂五方直符注鬼名結天考逆煞直符鬼名天殃一名越天一神長惡子孫鬼名髙睪子天一神長傷子鬼名譚契子天飛行長鐶子鬼名梁扶一名汝夫天信義長鬼子名太紫元右五鬼三官帝常遣司察人罪鬼恒在人間不可得見天雲中无名遊行鬼長三萬六千丈天雲中遊行鬼名瓇子又名憘音熈天雲中二十八宿直煞鬼名琙子右三鬼天隂陽鬼主煞生人東方青帝直符鬼名伯神子一名果子西方白帝直符鬼名伯和子南方赤帝直符鬼名泰伯子北方黒帝直符鬼名忝衣子中央黄帝直符鬼名伯溪一名淵右五方直符鬼常煞人六畜主作光怪死鬼先人所使東方青帝无名煞鬼姓元名谷玄從東方甲乙君使令以甲乙日辰日午時煞也南方赤帝姓變名乳西方白帝姓𨑤名顔之鼓切北方黒帝姓遐名明右四方煞鬼主煞天下逆惡不孝北斗主煞一人上下烏衣長七千丈姓呉名還臨子斗綱加煞七人長九丈赤幘主煞天下姦邪逆鬼太一主煞无形无名鬼長一丈六尺赤幘赤衣服天三五考煞鬼名慧長一丈七尺白衣赤幘持㦸向人天帝常司過鬼姓遐反名班子日暝人定時下聽人口語逆知心神還啓考煞五嶽鬼名進强右北斗等鬼主煞姦邪司聽語默甲子日鬼名元光乙丑日鬼名邴彰邴音丙丙寅日鬼名釗昌釗音昭丁卯日鬼名子方戊辰日鬼名生進已已日鬼名傳弁庚午日鬼名柴方辛未日鬼名音父五故切壬申日鬼名石松癸酉日鬼名倚音落甲戌日鬼名甲光乙亥日鬼名進五官切丙子日鬼名留遐丁丑日鬼名王眸戊寅日鬼名却心己卯日鬼名遥子庚辰日鬼名耳子辛已日鬼名元聲壬午日鬼名衘癸未日鬼名歷厨甲申日鬼名瑘光瑯以者切乙酉日鬼名聶下丙戌日鬼名𪚣生𪚣狼董切丁亥日鬼名石之蛇切戊子日鬼名證方已丑日鬼名㫖都庚寅日鬼名芩音琴辛卯日鬼名扶北切一音馥一音卜壬辰日鬼名契癸已日鬼名軰方甲午日鬼名麻子角乙未日鬼名不扶嚮丙申日鬼名右公丁酉日鬼名進卿一集戊戌日鬼名召厹髙已亥日鬼名珠夫子庚子日鬼名季方辛丑日鬼名以是切壬寅日鬼名羅結癸卯日鬼名健木甲辰日鬼名索良乙已日鬼名畾宂丙午日鬼名挺濃奴道切丁未日鬼名矣伍戊申日鬼名却己酉日鬼名戴劫庚戌日鬼名緫夫辛亥日鬼名安懸壬子日鬼名道子癸丑日鬼名唱适甲寅日鬼名别狀乙卯日鬼名天喑丙辰日鬼名天他計切丁已日鬼名天横戊午日鬼名耳音奔己未日鬼名噁噁庚申日鬼名義俚辛酉日鬼名義呼壬戌日鬼名夫音權癸亥日鬼名荅髙敵右甲子六十日直煞逆鬼六十人人身无異赤毛无衣有耳无目飛行千里其身三凶逆不孝煞害天民人隨日憶知其名鬼不敢近人甲子十日一旬凶神姓玄名玉衡甲戌十日一旬凶神姓恒名捧甲申十日一旬凶神姓既名音盈甲午十日一旬凶神姓本名滿甲辰十日一旬凶神姓恒名堅子甲寅十日一旬凶神姓蘇名右六甲神逆惡主煞神君人生於世无百年之生朝不保暮死多生少逆煞之鬼流布人間誑作百病五逆疾炁寒熱頭痛或腹内結堅吐逆短炁五内脹滿目視顛倒口唵手足臠縮不自知慮命在日夕凶鬼來守天下男女汝曹自可按吾圖書視鬼等名施吾太玄之下符上三天生炁三五七九之生以與天民天民死而更生自見天下男女從太始以來鬼黠不信吾真故隱秘斯經而死者不可勝數念之傷悼今重下律令天下鬼神姓名衣服綵色長短知律至正一之炁子可隨日名萬鬼不敢干子自不知言吾无神上怨大道下咎於人子反自中傷可慎三五之年子自當見天下不信真炁者及笑還與鬼私通念子自當分别今日何可得生子自三思勿違犯慎之律曰天道以鬼助神施炁人畏鬼不畏神詭託名於彼自號其位人聞鬼存无神百其語言故制隂陽清身和心无有邪滛可以制鬼御天下三萬六千餘神皆爲子使令子身不正反受其殃念子昌乎北斗主煞南斗注生煞是天綱生是三台自如人身上應天地法之日月道在不逺三五來反超然其可貴也天下散民中有孝順忠信者可書六十日鬼名著烏囊貯之常以正月一日日中時以身詣師家受之係著左右臂以此行來鬼不敢干天下太平送還本治夜行恐逢惡可服其鬼名鬼不敢當人不知鬼神自治空身受災不達義方通三六之年子自滅亡女青鬼律卷之一
