front:
  text: 女青鬼律卷之一二同卷力七律曰天地初生元氣施行萬神布氣无有醜逆祅邪不正之鬼男孝女貞君禮臣忠六合如一无有患害自後天皇元年以來轉生百巧不信大道五方逆殺疫氣漸興虎狼萬獸受氣長大百蟲蛇魅與日滋甚天有六十日日有一神神直一日日有千鬼飛行不可禁止大道不禁天師不勑放縱天下凶凶相逐唯任殺中民死者千億太上大道不忍見之二年七月七日日中時下此鬼律八卷紀天下鬼神姓名吉凶之術以勑天師張道陵使勑鬼神不得妄轉東西南北後有道男女生見吾祕經知鬼姓名皆吉萬鬼不干千神賔伏奉行如律不得妄傳非其人傳非其人災流七世勿怨道咎師紀姓名譜曰髙天萬丈鬼百鬼中皇姓係天六方鬼之主住在太山東南角道水中諸死人所歸鬼亦上天對問考罰月一上上古以來已三萬六千餘年如有三萬六千神與鬼等數南郷三老鬼俗五道鬼姓車名匿主諸死人録籍考計生人罪皆向之此鬼在太山西北角亦有官屬太山有召一還此鬼天煞唯聞文書上不著天下不著地雲中无頭壞軍死將逆惡大鬼姓李名三可北斗三台招揺大鬼姓伴名玩西斗三台鬼姓車名球南斗三台鬼姓溟名温夫中斗三台鬼姓王名咸東斗三台鬼姓角名車
