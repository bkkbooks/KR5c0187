body:
  text: 女青鬼律卷之二太清玄元上三天太上律勑天地水三官主者皇天初生唯神為尊今世憒憒邪亂紛紛不見真神唯鬼亂人今當紀别鬼名定立三五神以治鬼重下第二卷山海鬼姓名服之三年萬鬼不敢當行來出入制御邪魅道曰千年之木成人百歲之石為僮女百獸之形皆有鬼形豫知其名鬼復真形勿傳山精之鬼長一尺名濯肉木精之鬼名群天烏老切一名式石精之鬼名𤨒肉子𤨒於巾切虎精之鬼名健莊子蛇精之鬼名𠋙石圭𠋙音戚狩精之鬼名大皛子何鳥切猴精之鬼名馬子側毫切狐精之鬼名午音代𤟎樹之鬼名連不智𤟎各勿切五汙之鬼名截逍子汙音烏大山之鬼名弓强小山之鬼名和邴大樹之鬼名方域小木之鬼名轉其山室之鬼名啓削石舀之鬼名水連舀口感切土𤥴之鬼名客㬰𤥴音至磚石之鬼名月遡音訴槫木之鬼名汝逺槫徒磚切木榴之鬼名鳴㖘音震百蟲之鬼名遐𨑺莫號切空流之鬼名活䄴音朱江之鬼名逆鱗子孫容切漢明之鬼名咸𩲨昌利之鬼名堪坌音墳山都之鬼名天王蓋山之鬼名柱佳乩古兮切五色之鬼名後嚮太玄之鬼名居集男淫之鬼名戴文女淫之鬼名截交青氣溫鬼名髙逺白氣溫鬼名伯桑赤氣溫鬼名士玄黃氣溫鬼名君太黑氣溫鬼名文遐屋室之鬼名搖子食器之鬼名後服圊厠之鬼名項天井鬼名瓇竈鬼名干逺床鬼名赫子一扶金蓋鬼名晏麾幢鬼名託鼓音鬼名亂笙篁鬼名坩坑鬼名父雉一名羅元墟莒鬼名赫子一名入徴墟音區㦸之鬼名耳禽半音㮶刀鬼名劒子夫甲鎧之鬼名子賢元子車鬼名如賢子又馬車牛之鬼千歲白骨鬼名逺世百歲白骨鬼名音世五十年鬼名音忠音絳天獄鬼名瑾生子天鞭鬼名客夫元地青土公鬼名元地赤土公鬼名赤赫元地黃土公鬼名尅元地白土公鬼名述本地黑土公鬼名士民河伯鬼名逹九江鬼名活三河鬼名建四瀆鬼名候犬馬鬼名賜車鬼名慟朴榬之鬼名天賜一名兵車鐵精之鬼名醫願金精之鬼名夷衝銅器鬼名揚煞五嶽之鬼名耳𤢌一名山夫亂之鬼名趣一名歎發柱木之鬼名文羅一名元羅五斧之鬼名兀生長男之鬼名一名子石衣服之鬼名是奩苦頰切五綵之鬼名提敬五味之鬼名元側中切律曰天下一生之中自有千億之鬼去神更逺去鬼而近天下凶凶不可得知此遭凶遇死者千萬有人而鬼不已今記其真名使人知之一知鬼名邪不敢前三呼其鬼名鬼氣即絶天鬼來下地鬼并煞凡鬼皆有姓名子知三台鬼名萬鬼使令律曰人身有疾病厄急可令主者施符呼名鬼煞名用制鬼法人家有災疾不止可於中庭北向以符著日辰上便左手揲天關右手揲火行三呪言天一女青煞鬼萬千太一九氣收邪神鬼死神至道求無極叱叱便右回轉向天門閉氣二十四通通息還向地戶三呪言太一使我煞萬鬼鬼去神至急急如此三通百魅立到前後諸神扶送天綱催切諸鬼相考無有漏脫可以治身勿妄以示俗人太和之鬼無身有頭頭長三尺目大三寸耳廣七寸眉廣五寸口廣三寸鼻大二寸鬚長三尺長一丈呼吸天氣吐之成雲子行見者其名子碑三呼之形自見終鬼從者皆自伏子行勿以金錢著身其有光氣鬼逆見之避人有錢在身不可鬼知子解藏之若水行見者呼河紛其亦作水鬼易形為鳥形明如烏大子煞之勿告人三年人行來出入山海永無所畏大吉女青鬼律卷之二
