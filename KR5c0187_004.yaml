canonical_identifier: bkk:krp/KR5c0187/krp/v1/juan/4
seq: 4
front:
  text: 女青鬼律卷之四天師稽首敢承先王之道制民勑鬼今當以盟威正一之氣女青鬼律役使天下邪魅妖𦍙助道興化勒鬼真名主者明加切正使天下道氣宣布邪逆賔伏子知鬼名姓鬼自趨走不敢害人子常念之勿違犯矣道上將軍名侯夫道下將軍名逸車天上逆鬼名文延玄地下逆鬼名精子
  hash: sha256:ae63c71c48846a3d3d41a15923b7187ea4cd0044dfcbdea23140b7e4c98c2b13
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0187_HFL_004-001a, image: hfl/0563/0563-112.png}
body:
  text: 右四鬼主風雨時隨之作害人行來道路遭大風雨呼四鬼名惡氣不敢加古凶鬼謹忠世逆鬼孨耳孨子臠切右二鬼是古死人敗冢或巫師不正道士之鬼鬼害人百行子知其名鬼自伏住不敢動天正鬼迭卧迭大結切地正鬼枔木枔音琴右二鬼是宅中死煞守鬼常住人堂屋梁上夜主傷害人雞犬六畜子知其名鬼伏住不敢動此鬼不敢害人宅中應有福德之家此鬼主護人外客殃煞不敢過宅中申久年後穆髙右二鬼人家作屋不契柱色鼻朝成立見星月有靈神主煞人為邪子知其名鬼不害人令精華是輔坐右二鬼人家宅中有銅金錢精主作於此鬼鬼或變化作人形居宅不安呼之即去已巴艮赦姑殷咎右三鬼是人屋中四壁角中鬼主人夫妻無道不順隂陽此鬼白直符直符白奏事除人生籍子知名鬼不敢動并勑鬼著屋四壁角厭用桃剌長尺二朱書又懸門戶上勑法如左此符青龍主東白虎主西朱雀主南玄武主北中央黃驎辟除鬼賊急急如律令右符制百鬼天載芪嚮音惡注兩切右二鬼是門伯戶丞白日為神福室暮作鬼子知名人定時於門戶左右呼其名三掌手反首持兩三過此鬼即止不敢作害斧金木和鎧鉀粗右二鬼是人家宅上有樹或竹林為烏鳩止白鷺群鳥所依此皆有邪魅子知其名夕夕三呼之鬼知人不可干不過七日九日鬼自死不煞鬼者多暗中喚之鬼伏住不害人紫肝方轉肝喜俱切轉陟臠切汏洉上音大下音姤塵發右三鬼是世中癲癎煞人之鬼其赤衣服烏冠幘主收人魂子知其名有疾即差鬼不敢干桑華載辟氣途付右二鬼是女人月水之精鬼常貪隂陽血味女子月水來日夕存之呼名鬼不敢害人鬼長三尺上下青衣語忌敬唯鼻切右二鬼女臨産鬼女子産生時呼此鬼名即不害人鬼長三寸三分上下烏衣勗精華右一鬼主害人田蠶蠶女鬼夫立春日平旦可向天門三呪曰天之皇清明長逺上多神隂不及與汝馬姑來我宅中使蠶大得千萬倍次田畝汝收千億斛恩天中上下天地中上止大道勑華為我使叱咄急殺百傷小魅何狼粹金進百逍力追切右一鬼是旦夕掃除鬼令人失財子知名可日日平旦向天門三呼名呪曰石未子石未子太一使汝為我使何物逆鬼令速出速出道以令天下男女各受道思口訣真要以持示子子可以存念神明以真除邪八卷之中有第四卷至真可以度世子勿違犯慎之天師勑邪中是聞律鬼莫不伏聽飛符連天一元三靈此天師自呪身中神鬼要法逺兵士太王主元一九三氣丈人九氣父母太一使我收煞汝急出來良久俯三叱叱二十四喑喑右天師勑水大邪鬼不敢害人女青鬼律卷之四
