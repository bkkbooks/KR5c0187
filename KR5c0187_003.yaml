body:
  text: 女青鬼律卷之三四同卷力八道律禁忌天師曰視天下男女日用不忠行善不報災害日興天考鬼賊五毒流行皆生於不信不念守一行善身招其禍念子不得久世長生吾受太上教勑嚴切令以示天民令知禁忌不犯鬼神靈書女青玄都鬼律令使汝曹皆悉知聞逆者還順惡者還善改往修來當依鬼律令一者不得自東自西自南自北出入去來去無所關還無所白任意從心皆負律令除算三十二二者不得呼天無神言道師㫖敗刑亂政自言已是道人言非皆負鬼律天奪算一十三三者不得持真入僞姦亂聖明飲酒食肉呼嗟無道奪算千三百四者不得傳宣惡語道說他人妄作一法不信天道虛言無實天奪算千二百五者不得傳虛兩舌妄語喜怒無常專行逆煞不慎隂陽天奪算百三十二六者不得輕慢老人罵詈親戚夫妻呪詛自相煞害毒心造凶不孝五逆天奪算一百八十七者不得受道不知輕慢傳非其人貪財受利取人自益借物不還以為私寶天奪算一千八百八者不得鬪爭言語因醉淫色假託大道妄言鬼語要結男女飲酒食寅天奪算三百九者不得遊行東西周合男女消災不解因成邪亂天奪算萬三千死殃流七世十者不得傳道童女因入生門傷神犯氣逆惡無道身死無後不得反男為女隂陽倒錯天奪算三百十一者不得露合隂陽觸犯三光因酒往還承威相接天奪三百十二者不得一人氣生一人氣死逼犯真人天奪算三十三十三者不得一父子别居室家離散天奪算二十二十四者不得嗜欲惡失男女聚集妄道邪言天奪算百二十十五者不得同法相𡜍更相道說不信三五評論天氣長短天奪算八百二十三十六者不得逃遁父母遊行四方位立真氣自相收合天奪算三百二十十七者不得滅天所生妄煞走獸彈射飛鳥指南作北任心所從不依鬼律天奪算三千十八者不得干知人事宣布他家藏善出惡姦人婦女謀圖人壻逆戾三光隂賊呪詛不孝五逆天奪算千二百二十十九者不得行道之日貪色淫心行氣有長自解不已私共約誓因生不孝姦心五內無道之子天奪算三萬二十者不得思神不報因行生氣取降元氣貪淫愛色手足不離彌日竟夕如此無道天奪算三百四十二二十一者不得以赤氣妄傳俗人口手胸心更相交接委道自叛師主無法天奪算三百二十二者不得妄以經書授與俗人道父母名諱泄漏真要訣語俗人天奪算三百天師曰吾受太上㫖教禁忌甚重汝男女憒憒生來至今不知禁制自作一法與天相違考至主者天奪子算訖恐將可痛不見太平生者及祭酒道士宣化有功功過相贖民若不用故有宣化之心可自改往修來專一養性可度天三災九厄子唯行惡逆不行忠孝恐子年命不自保念子可傷幸復重囑丁寧甚也天師曰天下男女見善戒之文不能從用唯欲從其所欲教人行非走作口舌專作鬼教老小凶凶天下一時之樂千年之禍伐身之斧滅命之殳也子已知道及未知者見吾鬼律新故科文皆可從用三五七九之日慎行生氣子依吾圖局不犯三氣如可仙化民一千不知道父母真名故為俗人道士雖知黃書契令不知二十四神人故為僞人道極數訖天有三五子自不知何得言道不神子不知道何得言氣不明百聞不如一見子何不自改心易腸入吾生氣得為真人太平之日飛舉上天子只復不飛壽終不死便為地仙得見太平子日一日憒悶憒悶不信不忠唯行無道不見太平念子自衰吾當何苦天師曰天下男女已知三五七九長生大道子不依吾法行惡媱亂恐子死沒惡人之先幸復告想可勤之天師曰制節行道謹慎科文目不妄視口不妄言心不妄念足不妄遊親善逺惡與體自然故不重教幸復可思之女青鬼律卷之三
