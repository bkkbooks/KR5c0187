front:
  text: 女青鬼律卷之六天師曰自頃年以來隂陽不調水旱不適災變屢見者皆由人事失理使其然也人為中才法地則天動靜以時通而不爭利而無害故能神仙末世廢道急競為身不順天地伐逆師尊尊卑不别上下乖離善惡不分賢者隱匿國無忠臣亡義違仁法令不行更相欺詐致使寇賊充斥汙辱中華萬民流散荼毒飢寒被死者半十有九傷豈不痛哉豈不痛哉亂不可久狼子宜除道運應興太平期近今當驅除留善種人男女祭酒一切生民急相核實搜索忠賢恭慕道德按名列言自然者寡督厲宜勤若能改過即為勳人人無尊卑不遵貴賤唯惡為真不得私飾所舉參錯不直之人此者坐之無望久活帝王牧守長吏百僚若信吾言舉善而教不能則勸流刑行仁祭酒領録條列上天有勞顯報位登神仙有不用心憚勞回避不肯著名奉行善者即還惡人陷於驅除直符疏記毫分不差百姓樂善得為善人時還本鄉以安國土人人念善天下太平禍亂不作災害不生豈不快乎豈不快乎今遣五主各領萬鬼分布天下誅除凶惡被誅不得稱狂察之不得妄救鬼若濫誤謬加善人主者解釋祐而護之鬼若不去嚴加收治賞善罰惡明遵道科東方青氣鬼主姓劉名元逹領萬鬼行惡風之病南方赤氣鬼主姓張名元伯領萬鬼行熱毒之病西方白氣鬼主姓趙名公明領萬鬼行注氣之病北方黑氣鬼主姓鍾名士季領萬鬼行惡毒霍亂心腹絞痛之病中央黃氣鬼主姓史名文業領萬鬼行惡瘡癰腫之病
