body:
  text: 右五方鬼主諸欲著名生録為種民者按此文書隨病呼之知領鬼姓名病即差矣人人各寫一通繫身讀之令罹災害皆消東方青溫鬼名咎逺南方赤溫鬼名士言西方白溫鬼名堯北方黑溫鬼名天遐中央黃溫鬼名太黃奴第六溫鬼名誅女第七溫鬼名伯陵祖父名梁州祖母名交成父名延年母名出中右五方溫鬼兄弟七人合祖父母父母十一形能飛隨月行毒以誅惡人一蠱鬼名釋渠二蠱鬼名咎三蠱鬼名禮咎四蠱鬼名成晏五蠱鬼名不釋六蠱鬼名烏悟七蠱鬼名緣支八蠱鬼名育夷九蠱鬼名石千右九蠱之鬼行諸惡毒妖媚蠱亂天下與五溫鬼太黃奴等共行毒氣也正月溫鬼名惟二月溫鬼名腫三月溫鬼名劉四月溫鬼名存五月溫鬼名壘六月溫鬼名𦍙七月溫鬼名半八月溫鬼名懷九月溫鬼名農十月溫鬼名卑十一月溫鬼名嬴十二月溫鬼名堅右十二月溫鬼各隨其月放逸天下傷害群生子日溫鬼名根丑日溫鬼名蕩寅日溫鬼名怡卯日溫鬼名疑辰日溫鬼名厄巳日溫鬼名愛午日溫鬼名悟未日溫鬼名奴長申日溫鬼名未酉日溫鬼名石戌日溫鬼名志亥日溫鬼名憂右十二日溫鬼各各直其日從十二時支干上來疾病民人日月鬼蠱並順劉元逹等毒害五方不行道戒皆受其殃行善精勤存道遵教能知名皆共降伏法應去者各自逺迸制應留者却其凶黨更相約束不犯善人昃時病人之鬼名文通金精鬼名因兊木精鬼名倚震火精鬼名附離水精鬼名託坎土精鬼名乘川五精鬼名矯乾遊獦鬼名獲張血食鬼名刃方虎狼鬼名咳蓻蛇龍鬼名甲子狐狸鬼名勾舉黿鼉鬼名地殃露死鬼名天殃傷死鬼名真果獄死鬼名史蘇煁餓死鬼名伏藏客死鬼名逆千男傷鬼名萖悟千女傷鬼名艾赤丹冢訟鬼名害知丘丞鬼名地令墓伯鬼名土下侯冡下鬼名二千石右二十四鬼放縱下羅截四方充塞六合擅算五行更相署置官府列陳出入導從兵馬權強殺害無辜恣意快心寡福之人悉逢其苦志士學道方術厭禳符章禁斷乃保利貞斬死之鬼故死之鬼喪車之鬼𩲁之鬼天殃之鬼殃注之鬼雌雄之鬼寄死之鬼行客之鬼地殃之鬼天凶之鬼地凶之鬼天殺之鬼地殺之鬼日月玄符鬼三十六殺鬼百二十殃注鬼千殃萬魅鬼魍魎精邪鬼迷惑不利鬼火逆惡注鬼逆道醜賊鬼大道邪精千氣之鬼千二百官逆之鬼地上千師萬醫鬼天地水三官轉逆魅鬼著耳角之鬼自稱皇天上帝土玉鬼狐狸老精自號之鬼宅中強𦍙姦詐聲之鬼宅中魔邪恐怖人之鬼宅中靈林古瘞之鬼宅中光怪之鬼宅中虛耗之鬼宅中鄙辱離怨之鬼宅冢訟逮之鬼右三十六鬼皆遊行世間乘人衰隙伺候有惡助佐凶殃造作禍害改形易象隨便陵人學士知之立功建德啓告太上一切收治年初章奏列名斷之衆鬼畏懾悉自逃亡不告者一如律令女青鬼律卷之六
